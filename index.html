<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Law Quiz – PassingCAP1</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003366;
      --secondary: #0056b3;
      --accent: #C8A951;
      --bg: #f0f2f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      border-top: 5px solid var(--primary);
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo-badge {
      display: inline-block;
      background: var(--primary);
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      margin-bottom: 1.25rem;
    }
    .gold-line {
      width: 48px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 15px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--secondary); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">PassingCAP1</div>
    <div class="gold-line"></div>
    <h1>Law Study Tool</h1>
    <p>This Study Tool can now be found at <a href="https://harrypage87.github.io/PassingCAP1/" style="color: var(--secondary);">harrypage87.github.io/PassingCAP1/</a></p>
    <a class="btn" href="https://harrypage87.github.io/PassingCAP1/">Go to PassingCAP1 →</a>
  </div>
</body>
</html>
